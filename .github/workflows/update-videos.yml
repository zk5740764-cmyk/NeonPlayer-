name: Update videos.json

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yt-dlp
        run: pip install -U yt-dlp

      - name: Run scraper
        run: python scripts/fetch_videos.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add categories/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update category JSON files [skip ci]"
            git push
          fi

      - name: Purge jsDelivr CDN cache
        run: |
          # One file per category now instead of just videos.json/movies.json —
          # loop over whatever fetch_videos.py actually wrote (via manifest.json)
          # instead of hardcoding filenames here, so adding/removing a category
          # in the script doesn't also require editing this workflow.
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/categories/manifest.json" || true
          for name in $(python3 -c "import json; print('\n'.join(c['file'] for c in json.load(open('categories/manifest.json'))['categories']))"); do
            curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/categories/$name" || true
          done
          
